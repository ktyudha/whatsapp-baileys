services:
  app:
    build: .
    container_name: ${APP_NAME:-whatsapp-baileys}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "${PORT:-2881}:${PORT:-2881}"
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch(`http://127.0.0.1:$${process.env.PORT}/status`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
